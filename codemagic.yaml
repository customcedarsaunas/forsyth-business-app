workflows:
  ios-release:
    name: Forsyth Business iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: v22.11.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.johnforsyth.forsythbusiness
      vars:
        XCODE_WORKSPACE: "ForsythBusiness.xcworkspace"
        XCODE_SCHEME: "ForsythBusiness"

    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Set Apple bundle ID
        script: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('app.json','utf8')); p.expo.ios.bundleIdentifier='com.johnforsyth.forsythbusiness'; fs.writeFileSync('app.json', JSON.stringify(p,null,2));"

      - name: Generate iOS project
        script: |
          npx expo prebuild --platform ios --non-interactive

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles --project ios/*.xcodeproj

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
